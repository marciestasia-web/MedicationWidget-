<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medication Administration Record</title>
<style>
  :root{
    --ink:#1f2d3a; --muted:#5b6b78; --line:#c9d3dc; --head:#eef3f6; --side:#f7f9fb;
    --accent:#1b5e7a; --ok:#2e7d4f; --okbg:#e8f5ec; --err:#b42318; --errbg:#fdecea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mar{padding:2px 2px 6px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px;background:#fff}
  table{border-collapse:separate;border-spacing:0;min-width:100%}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;vertical-align:top;background:#fff;text-align:left}
  tr > *:last-child{border-right:0}
  tfoot tr > *{border-bottom:0}
  thead th{background:var(--head);font-weight:600}
  .rowh{position:sticky;left:0;z-index:2;min-width:170px;width:170px;background:var(--side);box-shadow:1px 0 0 var(--line)}
  thead .rowh{z-index:3;background:var(--head);vertical-align:bottom}
  tfoot th, tfoot td{background:var(--side)}
  .col{min-width:146px;width:146px}

  input{font:inherit;color:inherit;width:100%;border:1px solid var(--line);border-radius:4px;padding:7px 8px;background:#fff;min-height:38px;-webkit-appearance:none;appearance:none}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .dt input{padding:5px 6px;font-size:14px;min-height:34px}
  .dt input + input{margin-top:4px}
  .colbar{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px}
  .medcell{display:flex;gap:4px;align-items:center}
  .initials input{text-transform:uppercase;text-align:center;font-weight:600;letter-spacing:.04em}

  button{font:inherit;cursor:pointer;border-radius:4px}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .mini{border:1px solid var(--line);background:#fff;color:var(--accent);font-size:13px;padding:3px 8px;min-height:28px}
  .x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;min-height:28px;flex:none}
  .x.arm{color:#fff;background:var(--err);font-size:12px;padding:5px 6px}

  .msg{display:none;font-size:12px;color:var(--err);margin-top:4px;font-weight:600}
  .need{background:var(--errbg) !important}
  td.need input, input.missing{border-color:var(--err)}
  .need .msg{display:block}
  .signed{background:var(--okbg) !important}
  thead th.signed{box-shadow:inset 0 3px 0 var(--ok)}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{border:1px solid var(--accent);background:#fff;color:var(--accent);padding:8px 14px;min-height:40px;font-weight:600}
  .status{margin-top:8px;font-size:14px;color:var(--muted);min-height:1.4em}
  .status.bad{color:var(--err);font-weight:600}
  .tzlabel{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .local{font-size:12px;color:var(--muted);margin-top:3px;min-height:1em;white-space:pre-line}
  .local .rcv{display:block;color:var(--accent);font-weight:600}
  select.tzsel{display:block;font:inherit;font-size:13px;font-weight:600;width:100%;margin-top:4px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);min-height:32px}
  select.tzsel:focus{outline:2px solid var(--accent);outline-offset:-1px}
  select.tzsel.missing{border-color:var(--err);background:var(--errbg)}
  .selmsg{display:none;font-size:12px;color:var(--err);font-weight:600;margin-top:3px}
  select.tzsel.missing + .selmsg{display:block}
  .clock{display:block;font-weight:600;font-size:12px;color:var(--accent);margin-top:4px;line-height:1.35}
  .clock span{display:block;font-weight:400;color:var(--muted)}
  .medsub{display:flex;gap:6px;align-items:center;margin-top:4px}
  .medsub .freq{font-size:13px;padding:5px 6px;min-height:32px}
  .prn{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer}
  .prn input{width:20px;height:20px;min-height:0;margin:0;padding:0;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--accent)}
  select.tzsel.route{font-size:13px;margin-top:4px;min-height:32px}
  .doserow{display:flex;gap:4px}
  .doserow input{flex:1 1 42%;min-width:0}
  .doserow select.tzsel.unit{flex:1 1 58%;min-width:0;margin-top:0;min-height:38px;font-size:13px;padding:5px 4px}
  .dosemsg{display:none;font-size:12px;color:var(--err);font-weight:600;margin-top:3px}
  .dosemsg.show{display:block}
  .btn.quiet{border-color:var(--line);color:var(--muted)}
  #preview{display:none;margin-top:10px;max-width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
  #preview.show{display:block}
</style>
</head>
<body>
<div class="mar" id="mar">
  <div class="scroll"><table id="grid" aria-label="Medication administration record"></table></div>
  <div class="actions">
    <button type="button" class="btn" id="addMed">Add medication</button>
    <button type="button" class="btn" id="addTime">Add time</button>
    <button type="button" class="btn quiet" id="sortTimes">Sort by time</button>
    <button type="button" class="btn quiet" id="togglePreview" aria-expanded="true">Hide preview</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <img id="preview" class="show" alt="Preview of the medication record as it will appear in the PDF">
</div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var root = document.getElementById('mar');
  var uid = 0, booted = false, lastH = 0, sendTimer = null;
  var state = { cols: [], meds: [] };

  function nid() { return 'k' + (++uid); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  // "Now" records UTC by default, whatever time zone the device is set to.
  var useUTC = true;
  var zoneTouched = false; // true once a saved record sets the zone
  var zoneSet = false;     // record zone explicitly chosen (or preset by widget setting / saved record)
  // Receiving facility's time zone (minutes from UTC), or null when not set. Only changes how times are shown.
  var rcvMins = null, rcvTouched = false;
  function receivingTime(c) {
    if (rcvMins === null) return null;
    var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c.date || ''), tm = /^(\d{2}):(\d{2})/.exec(c.time || '');
    if (!dm || !tm) return null;
    var d = new Date(Date.UTC(+dm[1], +dm[2] - 1, +dm[3], +tm[1], +tm[2]) - zoneMins * 60000 + rcvMins * 60000);
    return {
      date: d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()),
      time: pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()),
      sameDay: d.getUTCFullYear() === +dm[1] && d.getUTCMonth() === +dm[2] - 1 && d.getUTCDate() === +dm[3],
      dayLabel: d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]
    };
  }
  function parseZone(v) {
    var m = /^\s*(?:UTC)?\s*([+\-−])?\s*(\d{1,2})(?::?(\d{2}))?\s*$/i.exec(String(v || ''));
    if (!m) return 0;
    var mins = (+m[2]) * 60 + (+(m[3] || 0));
    if (m[1] === '-' || m[1] === '−') mins = -mins;
    return (mins >= -720 && mins <= 840) ? mins : 0;
  }
  // Fixed time zone for the record, in minutes from UTC (0 = UTC). Crews can change it from the header.
  var zoneMins = 0;
  function zoneName() { return offsetLabel(zoneMins); }
  function stampNow(c) {
    var d = new Date();
    if (useUTC) {
      d = new Date(d.getTime() + zoneMins * 60000);
      c.date = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
      c.time = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    } else {
      c.date = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      c.time = pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
  }
  // Device-local equivalent of a UTC entry, shown as a hint under the time.
  function localHint(c) {
    if (!useUTC) return '';
    var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c.date || ''), tm = /^(\d{2}):(\d{2})/.exec(c.time || '');
    if (!dm || !tm) return '';
    var d = new Date(Date.UTC(+dm[1], +dm[2] - 1, +dm[3], +tm[1], +tm[2]) - zoneMins * 60000);
    var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var sameDay = d.getFullYear() === +dm[1] && d.getMonth() === +dm[2] - 1 && d.getDate() === +dm[3];
    return 'Device time ' + t + (sameDay ? '' : ' (' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ')');
  }
  // True if a column's date/time is later than now (5-minute allowance for small clock differences).
  var FUTURE_GRACE = 5 * 60000;
  function todayInZone() {
    var d = new Date();
    if (useUTC) { d = new Date(d.getTime() + zoneMins * 60000);
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function isFuture(c) {
    var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c.date || '');
    if (!dm) return false;
    var tm = /^(\d{2}):(\d{2})/.exec(c.time || '');
    if (!tm) return c.date > todayInZone();
    var t = useUTC ? Date.UTC(+dm[1], +dm[2] - 1, +dm[3], +tm[1], +tm[2]) - zoneMins * 60000
                   : new Date(+dm[1], +dm[2] - 1, +dm[3], +tm[1], +tm[2]).getTime();
    return t > Date.now() + FUTURE_GRACE;
  }
  function blankCol(fill) { var c = { id: nid(), date: '', time: '', initials: '' }; if (fill) stampNow(c); return c; }
  function blankMed() { return { id: nid(), name: '', freq: '', prn: false, doses: {}, units: {}, routes: {} }; }
  var UNITS = ['mg', 'mcg', 'g', 'units', 'mEq', 'mmol', 'mL'];
  function isNumber(v) { return /^\s*(\d+(\.\d*)?|\.\d+)\s*$/.test(v || ''); }
  var ROUTES = ['IV', 'IO', 'IM', 'SC', 'PO', 'SL', 'PR', 'NG/OG/G-tube'];
  function filled(v) { return (v || '').trim() !== ''; }

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'value') e.value = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) {
      if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function sortOnBlur(input) { input.addEventListener('blur', scheduleSort); return input; }
  function onEdit(input, fn) {
    input.addEventListener('input', fn);
    input.addEventListener('change', fn); // iOS date/time pickers fire change
    return input;
  }
  // Two-tap remove: first tap arms, second tap within 3 s removes.
  function removeBtn(fn, label) {
    var b = el('button', { type: 'button', 'class': 'x', 'aria-label': label, title: label }, ['×']);
    var t;
    b.addEventListener('click', function () {
      if (b.classList.contains('arm')) { clearTimeout(t); fn(); return; }
      b.classList.add('arm'); b.textContent = 'Remove?';
      t = setTimeout(function () { b.classList.remove('arm'); b.textContent = '×'; }, 3000);
    });
    return b;
  }

  // ---------- Chronological order ----------
  // Columns with both a date and a time sort by clock time; incomplete ones keep their order at the end.
  function colKey(c) { return (filled(c.date) && filled(c.time)) ? c.date + 'T' + c.time : null; }
  function orderedCols() {
    var done = [], rest = [];
    state.cols.forEach(function (c) { (colKey(c) ? done : rest).push(c); });
    done.sort(function (a, b) { var ka = colKey(a), kb = colKey(b); return ka < kb ? -1 : ka > kb ? 1 : 0; });
    return done.concat(rest);
  }
  function sortScreen() {
    var next = orderedCols();
    var moved = next.some(function (c, i) { return c !== state.cols[i]; });
    if (moved) state.cols = next;
    return moved;
  }
  var sortTimer = null;
  function scheduleSort() {
    clearTimeout(sortTimer);
    sortTimer = setTimeout(function () { if (sortScreen()) { render(); changed(); } }, 150);
  }

  function render() {
    // Keep focus on the same field when the grid is rebuilt (e.g. after columns are re-sorted).
    var act = document.activeElement, fk = act && act.getAttribute && act.getAttribute('data-fk');
    grid.textContent = '';
    var oneCol = state.cols.length === 1, oneMed = state.meds.length === 1;

    // Header: date and time per column
    var hr = el('tr', null, [el('th', { 'class': 'rowh', scope: 'col' }, ['Medication',
      useUTC ? el('label', { 'class': 'tzlabel' }, ['Time zone for this record', zoneSelect()]) : null,
      useUTC ? el('label', { 'class': 'tzlabel' }, ['Receiving facility time zone', rcvSelect()]) : null,
      useUTC ? el('span', { 'class': 'clock' }) : null])]);
    state.cols.forEach(function (c, i) {
      var n = i + 1;
      var bar = el('div', { 'class': 'colbar' }, [
        el('button', { type: 'button', 'class': 'mini', 'aria-label': 'Set time ' + n + ' to now' }, ['Now'])
      ]);
      bar.firstChild.addEventListener('click', function () { stampNow(c); sortScreen(); render(); changed(); });
      if (!oneCol) bar.appendChild(removeBtn(function () {
        state.cols.splice(state.cols.indexOf(c), 1);
        state.meds.forEach(function (m) { delete m.doses[c.id]; if (m.routes) delete m.routes[c.id]; if (m.units) delete m.units[c.id]; });
        render(); changed();
      }, 'Remove time ' + n));
      hr.appendChild(el('th', { 'class': 'col dt', 'data-col': c.id, scope: 'col' }, [
        bar,
        sortOnBlur(onEdit(el('input', { type: 'date', value: c.date, max: todayInZone(), 'class': 'cdate', 'data-fk': 'd:' + c.id, 'aria-label': 'Date, time ' + n }),
          function (e) { c.date = e.target.value; changed(); })),
        sortOnBlur(onEdit(el('input', { type: 'time', value: c.time, 'class': 'ctime', 'data-fk': 't:' + c.id, 'aria-label': 'Time ' + n }),
          function (e) { c.time = e.target.value; changed(); })),
        el('div', { 'class': 'local' }),
        el('div', { 'class': 'msg' }, ['Date and time required'])
      ]));
    });
    grid.appendChild(el('thead', null, [hr]));

    // Body: one row per medication, dose under each time
    var tb = el('tbody');
    state.meds.forEach(function (m, r) {
      var nameIn = onEdit(el('input', { type: 'text', value: m.name, placeholder: 'Medication name',
        autocomplete: 'off', 'aria-label': 'Medication ' + (r + 1) + ' name', 'class': 'medname', 'data-fk': 'n:' + m.id }),
        function (e) { m.name = e.target.value; changed(); });
      var cell = el('div', { 'class': 'medcell' }, [nameIn]);
      if (!oneMed) cell.appendChild(removeBtn(function () {
        state.meds.splice(state.meds.indexOf(m), 1); render(); changed();
      }, 'Remove medication ' + (r + 1)));
      var freqIn = onEdit(el('input', { type: 'text', value: m.freq || '', placeholder: 'Frequency', 'class': 'freq', 'data-fk': 'f:' + m.id,
        autocomplete: 'off', 'aria-label': 'Medication ' + (r + 1) + ' frequency' }),
        function (e) { m.freq = e.target.value; changed(); });
      var prnBox = el('input', { type: 'checkbox', 'aria-label': 'Medication ' + (r + 1) + ' given as needed (PRN)' });
      prnBox.checked = !!m.prn;
      prnBox.addEventListener('change', function () { m.prn = prnBox.checked; changed(); });
      var sub = el('div', { 'class': 'medsub' }, [freqIn, el('label', { 'class': 'prn' }, [prnBox, 'PRN'])]);
      var tr = el('tr', null, [el('th', { 'class': 'rowh', scope: 'row', 'data-med': m.id }, [
        cell, sub, el('div', { 'class': 'msg' }, ['Medication name required'])
      ])]);
      state.cols.forEach(function (c, i) {
        if (!m.routes) m.routes = {};
        var rsel = el('select', { 'class': 'tzsel route', 'data-med': m.id, 'data-col': c.id, 'data-fk': 'r:' + m.id + ':' + c.id,
          'aria-label': 'Route for medication ' + (r + 1) + ' at time ' + (i + 1) });
        rsel.appendChild(el('option', { value: '' }, ['Route…']));
        ROUTES.forEach(function (rt) {
          var o = el('option', { value: rt }, [rt]);
          if (m.routes[c.id] === rt) o.selected = true;
          rsel.appendChild(o);
        });
        rsel.addEventListener('change', function () { m.routes[c.id] = rsel.value; changed(); });
        if (!m.units) m.units = {};
        var usel = el('select', { 'class': 'tzsel unit', 'data-med': m.id, 'data-col': c.id, 'data-fk': 'u:' + m.id + ':' + c.id,
          'aria-label': 'Units for medication ' + (r + 1) + ' at time ' + (i + 1) });
        usel.appendChild(el('option', { value: '' }, ['Unit']));
        UNITS.forEach(function (u) {
          var o = el('option', { value: u }, [u]);
          if (m.units[c.id] === u) o.selected = true;
          usel.appendChild(o);
        });
        usel.addEventListener('change', function () { m.units[c.id] = usel.value; changed(); });
        var doseIn = onEdit(el('input', { type: 'text', inputmode: 'decimal', value: m.doses[c.id] || '', placeholder: 'Dose',
          autocomplete: 'off', 'class': 'dosenum', 'data-med': m.id, 'data-col': c.id, 'data-fk': 'x:' + m.id + ':' + c.id,
          'aria-label': 'Dose amount of medication ' + (r + 1) + ' at time ' + (i + 1) }),
          function (e) { m.doses[c.id] = e.target.value; changed(); });
        tr.appendChild(el('td', { 'class': 'col', 'data-col': c.id }, [
          el('div', { 'class': 'doserow' }, [doseIn, usel]),
          el('span', { 'class': 'dosemsg', 'data-med': m.id, 'data-col': c.id }),
          rsel, el('span', { 'class': 'selmsg' }, ['Route required'])
        ]));
      });
      tb.appendChild(tr);
    });
    grid.appendChild(tb);

    // Footer: initials per column
    var fr = el('tr', null, [el('th', { 'class': 'rowh', scope: 'row' }, ['Initials'])]);
    state.cols.forEach(function (c, i) {
      fr.appendChild(el('td', { 'class': 'col initials', 'data-col': c.id }, [
        onEdit(el('input', { type: 'text', value: c.initials, maxlength: '4', autocomplete: 'off', 'data-fk': 'i:' + c.id,
          autocapitalize: 'characters', spellcheck: 'false', 'aria-label': 'Initials, time ' + (i + 1) }),
          function (e) { c.initials = e.target.value.toUpperCase(); changed(); }),
        el('div', { 'class': 'msg' }, ['Initials required'])
      ]));
    });
    grid.appendChild(el('tfoot', null, [fr]));

    validate();
    updateClock();
    resize();
    if (fk) { var back = grid.querySelector('[data-fk="' + fk + '"]'); if (back) try { back.focus({ preventScroll: true }); } catch (e) { back.focus(); } }
  }

  // Live reference: current UTC time next to the phone's own time, so crews can see the conversion.
  function offsetLabel(mins) {
    if (!mins) return 'UTC';
    var a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
    return 'UTC' + (mins < 0 ? '−' : '+') + h + (m ? ':' + pad(m) : '');
  }
  // Time zone picker. Changing it converts times already entered, so each still marks the same moment.
  function zoneSelect() {
    var sel = el('select', { 'class': 'tzsel tz-record', 'aria-label': 'Time zone for this record' });
    var pick = el('option', { value: '' }, ['Select time zone…']);
    if (!zoneSet) pick.selected = true;
    sel.appendChild(pick);
    for (var mins = -720; mins <= 840; mins += 30) {
      var o = el('option', { value: String(mins) }, [offsetLabel(mins)]);
      if (zoneSet && mins === zoneMins) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', function () {
      if (sel.value === '') return;
      var next = parseInt(sel.value, 10), delta = next - zoneMins;
      state.cols.forEach(function (c) { shiftCol(c, delta); });
      zoneMins = next; zoneSet = true;
      render(); changed();
    });
    return el('span', null, [sel, el('span', { 'class': 'selmsg' }, ['Time zone required'])]);
  }
  function rcvSelect() {
    var sel = el('select', { 'class': 'tzsel tz-rcv', 'aria-label': 'Receiving facility time zone' });
    var none = el('option', { value: 'none' }, ['Select time zone…']);
    if (rcvMins === null) none.selected = true;
    sel.appendChild(none);
    for (var mins = -720; mins <= 840; mins += 30) {
      var o = el('option', { value: String(mins) }, [offsetLabel(mins)]);
      if (mins === rcvMins) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', function () {
      rcvMins = sel.value === 'none' ? null : parseInt(sel.value, 10);
      render(); changed();
    });
    return el('span', null, [sel, el('span', { 'class': 'selmsg' }, ['Time zone required'])]);
  }
  function shiftCol(c, delta) {
    var tm = /^(\d{2}):(\d{2})/.exec(c.time || '');
    if (!tm || !delta) return;
    var dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c.date || '');
    var base = dm ? Date.UTC(+dm[1], +dm[2] - 1, +dm[3], +tm[1], +tm[2]) : Date.UTC(2000, 0, 1, +tm[1], +tm[2]);
    var d = new Date(base + delta * 60000);
    if (dm) c.date = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    c.time = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
  }
  function updateClock() {
    var box = grid.querySelector('.clock');
    if (!box) return;

    validate();
    clearTimeout(sendTimer);
    sendTimer = setTimeout(function () {
      if (window.JFCustomWidget) { try { JFCustomWidget.sendData({ value: outputValue() }); } catch (e) {} }
      refreshPreview();
    }, 300);
    resize();
  }

  function resize() {
    var h = Math.ceil(root.getBoundingClientRect().height) + 8;
    if (h === lastH || !window.JFCustomWidget) return;
    lastH = h;
    try { JFCustomWidget.requestFrameResize({ height: h }); } catch (e) {}
  }

  document.getElementById('addMed').addEventListener('click', function () {
    state.meds.push(blankMed()); render(); changed();
    var names = grid.querySelectorAll('.medname');
    if (names.length) names[names.length - 1].focus();
  });
  document.getElementById('sortTimes').addEventListener('click', function () {
    var moved = sortScreen(); render(); changed();
    statusEl.textContent = statusEl.textContent || (moved ? 'Times sorted.' : 'Times are already in order.');
  });
  document.getElementById('addTime').addEventListener('click', function () {
    var nc = blankCol(true);
    state.cols.push(nc); sortScreen(); render(); changed();
    var th = grid.querySelector('thead th[data-col="' + nc.id + '"]'), sc = grid.parentNode;
    if (th) sc.scrollLeft = Math.max(0, th.offsetLeft - 175);
  });

  // Starting layout
  readSettings();
  state.cols = [blankCol(), blankCol(), blankCol(), blankCol()];
  state.meds = [blankMed(), blankMed(), blankMed()];
  render();
  refreshPreview();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(root);

  // Jotform hookup (runs once the widget library has loaded; page also works standalone for testing)
  window.MAR_BOOT = function () {
    if (booted || !window.JFCustomWidget) return;
    booted = true;
    JFCustomWidget.subscribe('ready', function (data) {
      readSettings();
      var v = data && data.value;
      render();
      restore(v).then(function (ok) {
        render();
        refreshPreview();
        if (!ok && v && /^(data:image|https?:)/i.test(v)) {
          statusEl.textContent = 'The saved record could not be reloaded here. The submitted copy is unchanged.';
          statusEl.className = 'status bad';
        }
        lastH = 0; resize();
      });
    });
    JFCustomWidget.subscribe('submit', function () {
      var ok = validate();
      JFCustomWidget.sendSubmit({ valid: ok, value: ok ? outputValue() : serialize() });
    });
  };

  // Offline cache
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) {}
  }
})();
</script>

<!-- Load the Jotform widget library: local copy first (works offline), Jotform's CDN as fallback -->
<script>
(function () {
  function boot() { if (window.MAR_BOOT) window.MAR_BOOT(); }
  var s = document.createElement('script');
  s.src = 'JotFormCustomWidget.min.js';
  s.onload = boot;
  s.onerror = function () {
    var c = document.createElement('script');
    c.src = 'https://js.jotform.com/JotFormCustomWidget.min.js';
    c.onload = boot; c.onerror = boot;
    document.head.appendChild(c);
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
